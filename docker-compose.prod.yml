version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: always
    networks:
      - smartpath_network

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - smartpath_network

  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 SmartPathAcademy.wsgi:application
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - smartpath_network

  celery:
    build: .
    command: celery -A SmartPathAcademy worker -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - smartpath_network

  celery-beat:
    build: .
    command: celery -A SmartPathAcademy beat -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - smartpath_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    restart: always
    networks:
      - smartpath_network

networks:
  smartpath_network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
