<div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-24">
    <h6 class="fw-semibold mb-0">{{ title|default:"Dashboard" }}</h6>
    <ul class="d-flex align-items-center gap-2">
        <li class="fw-medium">
            <a href="{% url 'student-dashboard' %}" class="d-flex align-items-center gap-1 hover-text-primary">
                <iconify-icon icon="solar:home-smile-angle-outline" class="icon text-lg"></iconify-icon>
                Dashboard
            </a>
        </li>
        {% if breadcrumbs %}
            {% for crumb in breadcrumbs %}
                <li>-</li>
                <li class="fw-medium">
                    {% if crumb.url %}
                        <a href="{{ crumb.url }}" class="hover-text-primary">{{ crumb.name }}</a>
                    {% else %}
                        {{ crumb.name }}
                    {% endif %}
                </li>
            {% endfor %}
        {% elif subTitle %}
            <li>-</li>
            <li class="fw-medium">{{ subTitle }}</li>
        {% endif %}
    </ul>
</div>
