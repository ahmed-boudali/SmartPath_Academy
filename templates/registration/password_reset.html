{% extends 'auth_base.html' %}
{% load static %}

{% block title %}Reset Password - SmartPath Academy{% endblock %}
{% block subtitle %}Enter your email to receive reset instructions{% endblock %}

{% block content %}
<div class="text-center mb-4">
    <iconify-icon icon="solar:lock-password-unlocked-outline" style="font-size: 64px; color: var(--primary-600);"></iconify-icon>
</div>

<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="id_email" class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" id="id_email" placeholder="your@email.com" required>
    </div>
    
    <button type="submit" class="btn btn-primary w-100 mb-3">
        <iconify-icon icon="solar:letter-outline" class="icon me-2"></iconify-icon>
        Send Reset Link
    </button>
</form>

<div class="auth-links">
    <a href="{% url 'login' %}">Back to Login</a>
</div>
{% endblock %}
